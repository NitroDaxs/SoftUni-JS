<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>This is a simple number printer</h1>
        <input class="inputBox" type="number" id="input" placeholder="Enter a number" />
        <section>
            <button class="btn-submit" onclick="printNumber()" id="print">Print</button>
            <button class="btn-clear" onclick="clearOutput()" id="clear">Clear</button>
        </section>
        <p id="output"></p>
    </div>
</body>

</html>
