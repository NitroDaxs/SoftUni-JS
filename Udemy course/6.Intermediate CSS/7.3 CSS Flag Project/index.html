<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>

    div{
      margin: 0px;
      padding: 0px;
    }
    p{
      font-size: 75px;
      margin: 0px;
      padding: 0px;
    }
    .flag {
      width: 900px;
      height: 600px;
      background-color: #CE1126;
      position: relative;
    }
    .flag > p{
      text-align: center;
      color: white;
    }

    div > div > div{
      background-color: #002868;
      position: absolute;
      height: 300px;
      bottom: 150px;
      width: 100%;
      text-align: center;
    }

    .flag > div > div > p{
      background-color: white;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      position: absolute;
      left: 350px;
      top: 50px;
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
